name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as
        you can — it makes it much faster to reproduce and fix.

  - type: input
    id: version
    attributes:
      label: shiki version
      description: Output of `shiki --version`, or the version shown in the footer
      placeholder: "0.8.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and terminal emulator
      description: e.g. "Arch Linux, kitty" / "Windows 11, Windows Terminal" / "macOS 15, iTerm2"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a notebook with...
        2. Press `leader+...`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        If applicable, paste the relevant lines from the in-TUI logs modal
        (leader+`l`) or `~/.config/shiki/shiki.log`. Redact anything
        sensitive.
      render: text
    validations:
      required: false
